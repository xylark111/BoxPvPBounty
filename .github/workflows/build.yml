name: Build BoxPvPBounty

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: unzip -o BoxPvPBounty-source.zip

      - name: Build
        run: mvn -B clean package
        working-directory: BoxPvPBounty

      - uses: actions/upload-artifact@v4
        with:
          name: BoxPvPBounty
          path: BoxPvPBounty/target/BoxPvPBounty-1.0.0.jar
