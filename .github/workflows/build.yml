name: Build BoxPvPBounty

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract zip (jika ada)
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z"
          done || true

      - name: Build
        run: |
          POM=$(find . -name pom.xml -not -path './.git/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "pom.xml tidak ditemukan. Isi repo:"
            ls -R
            exit 1
          fi
          echo "Build dari: $POM"
          cd "$(dirname "$POM")"
          mvn -B clean package
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp target/BoxPvPBounty-1.0.0.jar "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: BoxPvPBounty
          path: out/BoxPvPBounty-1.0.0.jar
